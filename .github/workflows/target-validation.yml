name: NEWOS target validation

on:
  workflow_dispatch:
    inputs:
      newos_ref:
        description: NEWOS commit to validate against
        required: false
        type: string
        default: 7cb7d01a2798224c9e850868b35e60b4943425ba

permissions:
  contents: read

jobs:
  build-and-qemu:
    name: Cross-build VOXEL and run its demo in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEWOS_ROOT: ${{ github.workspace }}/NEWOS
      VOXEL_ROOT: ${{ github.workspace }}/voxel
    steps:
      - name: Check out VOXEL and pinned TinyGL
        uses: actions/checkout@v4
        with:
          path: voxel
          submodules: recursive

      - name: Check out NEWOS at a fixed revision
        uses: actions/checkout@v4
        with:
          repository: CRISTOP-bot/NEWOS
          ref: ${{ inputs.newos_ref }}
          path: NEWOS
          submodules: recursive

      - name: Install NEWOS build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make nasm binutils python3 curl unzip \
            libgmp-dev libmpfr-dev libmpc-dev flex bison texinfo \
            qemu-system-x86 grub-common grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools ovmf

      - name: Bootstrap NEWOS pinned modules
        run: make -C "$NEWOS_ROOT" bootstrap

      - name: Build the real NEWOS x86_64-elf toolchain
        id: newos-toolchain
        run: |
          set -o pipefail
          make -C "$NEWOS_ROOT" toolchain V=0 2>&1 | tee "$RUNNER_TEMP/newos-toolchain.log"

      - name: Build the NEWOS C SDK
        id: newos-sdk
        run: |
          set -o pipefail
          export PATH="$NEWOS_ROOT/toolchain/out/bin:$PATH"
          make -C "$NEWOS_ROOT" CROSS_PREFIX=x86_64-elf- sdk V=0 \
            2>&1 | tee "$RUNNER_TEMP/newos-sdk.log"

      - name: Prepare a direct wrapper for the staged NEWOS SDK
        shell: bash
        run: |
          # Use NEWOS's actual cross compiler, CRT, linker script and SDK libraries.
          # This avoids rerunning SDK staging for each VOXEL executable.
          cat > "$RUNNER_TEMP/voxel-newos-gcc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="${NEWOS_ROOT:?NEWOS_ROOT must name the checked-out NEWOS tree}"
          TC_BIN="$ROOT/toolchain/out/bin"
          FPFLAGS=(-mgeneral-regs-only)
          if [ "${NEWOS_FPU:-0}" = "1" ]; then FPFLAGS=(); fi
          CC="$TC_BIN/x86_64-elf-gcc"
          SDK="$ROOT/build/newos-sdk"
          test -x "$CC"
          test -f "$SDK/usr/lib/crt0.o"
          exec "$CC" \
            -ffreestanding -fno-pic -fno-pie -fno-stack-protector \
            -fno-builtin -fno-asynchronous-unwind-tables -fno-unwind-tables \
            "${FPFLAGS[@]}" -O2 \
            -isystem "$SDK/usr/include" \
            -nostdlib -static -no-pie \
            -Wl,-T,"$ROOT/user/lib/app.ld" \
            -Wl,--build-id=none -Wl,-e,_start \
            "$@" \
            -L"$SDK/usr/lib" \
            -Wl,--start-group -lnsh -lc -Wl,--end-group -lgcc
          EOF
          chmod +x "$RUNNER_TEMP/voxel-newos-gcc"

      - name: Cross-build the regular VOXEL demo
        id: voxel-demo
        run: |
          set -o pipefail
          make -C "$VOXEL_ROOT" NEWOS_ROOT="$NEWOS_ROOT" \
            NEWOS_GCC="$RUNNER_TEMP/voxel-newos-gcc" demo \
            2>&1 | tee "$RUNNER_TEMP/voxel-demo-build.log"

      - name: Build the NEWOS package
        id: voxel-package
        run: |
          set -o pipefail
          make -C "$VOXEL_ROOT" NEWOS_ROOT="$NEWOS_ROOT" \
            NEWOS_GCC="$RUNNER_TEMP/voxel-newos-gcc" package \
            2>&1 | tee "$RUNNER_TEMP/voxel-package-build.log"

      - name: Inject the real VOXEL package into the disposable NEWOS image
        id: inject-package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$NEWOS_ROOT/toolchain/out/bin:$PATH"
          # Build NEWOS's regular sample target first so its binary-object rule
          # will consume the replacement package in the subsequent image build.
          make -C "$NEWOS_ROOT" CROSS_PREFIX=x86_64-elf- build/sample.new V=0 \
            2>&1 | tee "$RUNNER_TEMP/newos-sample-package.log"
          cp "$NEWOS_ROOT/build/packages/voxel-0.1.0-x86_64.new" \
            "$NEWOS_ROOT/build/sample.new"
          test -s "$NEWOS_ROOT/build/sample.new"
          # The archive's internal metadata identifies it as voxel; NEWOS's
          # initramfs stages this opaque blob at the documented sample path.
          cat > "$NEWOS_ROOT/user/rootfs/nsh.rc" <<'EOF'
          newpkg install /tmp/gnu-coreutils.new
          newpkg verify /tmp/hello-new-1.0.0-x86_64.new
          newpkg install /tmp/hello-new-1.0.0-x86_64.new
          voxel --frames 1
          EOF
          test -s "$NEWOS_ROOT/user/rootfs/nsh.rc"

      - name: Build NEWOS system image with the injected package
        id: newos-image
        shell: bash
        run: |
          set -o pipefail
          export PATH="$NEWOS_ROOT/toolchain/out/bin:$PATH"
          make -C "$NEWOS_ROOT" CROSS_PREFIX=x86_64-elf- system-image-build V=0 \
            2>&1 | tee "$RUNNER_TEMP/newos-image.log"

      - name: Boot NEWOS and run the packaged VOXEL demo in QEMU
        id: qemu-demo
        shell: bash
        run: |
          set +e
          timeout 60 qemu-system-x86_64 \
            -cdrom "$NEWOS_ROOT/build/images/newos-x86_64-limine.iso" \
            -boot order=d -serial "file:$RUNNER_TEMP/voxel-qemu.log" \
            -no-reboot -m 512M -display none
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU exited unexpectedly: $qemu_status"
            exit 1
          fi
          log="$RUNNER_TEMP/voxel-qemu.log"
          grep -F 'limine: framebuffer 1280x800 pitch 5120 bpp 32' "$log"
          grep -F 'fb: 1280x800 pitch 5120 bpp 32' "$log"
          grep -F 'NEWOS 0.3.0-gui (x86_64) booted' "$log"
          grep -F '=== 7 tests, 0 failures ===' "$log"
          grep -F '=== 9 tests, 0 failures ===' "$log"
          grep -F 'verify: /tmp/hello-new-1.0.0-x86_64.new: OK (1 files)' "$log"
          grep -F 'install: voxel 0.1.0: OK (1 files)' "$log"
          grep -F 'VOXEL: software compositor ready;' "$log"
          grep -F 'VOXEL: demo completed successfully.' "$log"
          if grep -E 'VOXEL: (no supported NEWOS framebuffer|framebuffer presentation failed|unable to initialize)' "$log"; then
            echo "VOXEL reported a runtime/framebuffer error"
            exit 1
          fi

      - name: Cross-build the optional TinyGL demo
        id: tinygl-build
        if: always() && steps.newos-toolchain.outcome == 'success' && steps.newos-sdk.outcome == 'success'
        run: |
          set -o pipefail
          make -C "$VOXEL_ROOT" NEWOS_ROOT="$NEWOS_ROOT" \
            NEWOS_GCC="$RUNNER_TEMP/voxel-newos-gcc" tinygl \
            2>&1 | tee "$RUNNER_TEMP/tinygl-build.log"

      - name: Show recent build/serial logs on failure
        if: failure()
        shell: bash
        run: |
          for file in \
              "$RUNNER_TEMP/newos-toolchain.log" \
              "$RUNNER_TEMP/newos-sdk.log" \
              "$RUNNER_TEMP/voxel-demo-build.log" \
              "$RUNNER_TEMP/voxel-package-build.log" \
              "$RUNNER_TEMP/newos-sample-package.log" \
              "$RUNNER_TEMP/newos-image.log" \
              "$RUNNER_TEMP/tinygl-build.log" \
              "$RUNNER_TEMP/voxel-qemu.log"; do
            if [ -f "$file" ]; then
              echo "Recent lines from $file"
              tail -n 40 "$file" | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
          done

      - name: Upload target binaries, package, boot image, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxel-newos-target
          if-no-files-found: warn
          path: |
            voxel/build/voxel.elf
            voxel/build/voxel-tinygl.elf
            NEWOS/build/packages/voxel-0.1.0-x86_64.new
            NEWOS/build/sample.new
            NEWOS/build/images/newos-x86_64-limine.iso
            ${{ runner.temp }}/newos-toolchain.log
            ${{ runner.temp }}/newos-sdk.log
            ${{ runner.temp }}/voxel-demo-build.log
            ${{ runner.temp }}/voxel-package-build.log
            ${{ runner.temp }}/newos-sample-package.log
            ${{ runner.temp }}/newos-image.log
            ${{ runner.temp }}/tinygl-build.log
            ${{ runner.temp }}/voxel-qemu.log
